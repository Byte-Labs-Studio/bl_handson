<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>bl_handson</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section id="panel" class="panel hidden">
        <header>
            <span id="title" class="title"></span>
            <span id="count" class="count"></span>
        </header>
        <div id="bar" class="steps"><div id="barFill"></div></div>
        <h1 id="label"></h1>
        <p id="hint"></p>
        <div id="gauge" class="gauge"></div>
        <footer>
            <div id="strikes" class="strikes"></div>
            <div class="keys"><kbd>LMB</kbd> grab &nbsp; <kbd>E</kbd> confirm &nbsp; <kbd>X</kbd> stop</div>
        </footer>
    </section>
    <div id="toast" class="toast"></div>
    <script src="app.js"></script>
</body>
</html>
